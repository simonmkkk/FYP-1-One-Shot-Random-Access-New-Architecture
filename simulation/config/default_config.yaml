# ============================================================================
# One-Shot Random Access 模擬預設配置
# ============================================================================
#
# 此配置文件定義 One-Shot Random Access 模擬的參數。
# 用於 Figure 3, 4, 5 的蒙特卡洛模擬。
#
# 參數說明：
#   M: 初始設備數量（嘗試接入的 UE 數）
#   N: RAO 數量（Preamble pool size）
#   I_max: 最大 Access Cycle 數
#   num_samples: 模擬樣本數
#   num_workers: 並行工作進程數（-1 表示使用所有 CPU 核心）
#
# ============================================================================

# 模擬參數
simulation:
  M: 100               # 初始設備數量
  I_max: 10            # 最大 Access Cycle 數
  num_samples: 100000  # 模擬樣本數（建議 10^5 ~ 10^7）
  num_workers: -1      # 並行工作進程數（-1 = 自動）

# N 值掃描配置
scan:
  type: "n_scan"       # 掃描類型：n_scan
  range:
    start: 10          # 起始 N 值
    stop: 101          # 結束 N 值（不包含）
    step: 10           # 步長

# 輸出配置
output:
  save_csv: true                    # 是否保存 CSV
  result_dir: "result/simulation"   # 結果目錄

# 實驗元數據
experiment:
  name: "default"
  description: "One-Shot Random Access 預設配置"
